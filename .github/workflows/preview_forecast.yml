name: Preview forecast build

# Runs the full live forecast on a pull request, exactly as the 15-minute job
# does, but writes the site to an artifact instead of publishing it. Download
# the "site-preview" artifact and open index.html (any static server) to check
# a change before merging.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "models/**"
      - "docs/index.html"
      - "generate_all_location_figures.py"
      - "requirements.txt"
      - ".github/workflows/preview_forecast.yml"
  workflow_dispatch:

concurrency:
  group: preview-forecast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore cached EA rainfall CSVs
        uses: actions/cache/restore@v4
        with:
          path: data/rainfall_training_data
          key: ea-rain-${{ runner.os }}-v2-preview
          restore-keys: |
            ea-rain-${{ runner.os }}-v2-
            ea-rain-${{ runner.os }}-v1-
      - name: Populate rainfall_training_data when cache miss
        run: |
          mkdir -p data/rainfall_training_data
          COUNT="$(find data/rainfall_training_data -maxdepth 1 -type f -name '*.csv' | wc -l | tr -d ' ')"
          NEWEST="$(python src/flag_predictor/data/rain_cache_newest.py data/rainfall_training_data)"
          STALE="$(python -c "from datetime import date, timedelta; print(int(date.fromisoformat('${NEWEST}') < date.today() - timedelta(days=40)))")"
          echo "cache: ${COUNT} files, newest reading ${NEWEST}"
          if [ "${COUNT:-0}" -lt 15 ]; then
            python src/flag_predictor/data/download_rainfall.py \
              --min-date "$(date -u -d '800 days ago' +%F)" --delay 1.5
          elif [ "$STALE" = "1" ]; then
            # download_rainfall.py never overwrites, so download into a fresh folder and swap.
            rm -rf data/rainfall_refresh
            if python src/flag_predictor/data/download_rainfall.py --min-date "$(date -u -d '800 days ago' +%F)" \
                 --output-dir data/rainfall_refresh --delay 1.5 \
               && [ "$(find data/rainfall_refresh -maxdepth 1 -name '*.csv' -size +1k | wc -l)" -ge 15 ]; then
              mv -f data/rainfall_refresh/*.csv data/rainfall_training_data/
            fi
            rm -rf data/rainfall_refresh
          fi
      - name: Download recent rainfall
        continue-on-error: true
        run: |
          python src/flag_predictor/data/download_rainfall.py \
            --min-date "$(date -u -d '50 days ago' +%F)" \
            --output-dir data/recent_rainfall --delay 1.0 || true
      - name: Build the site into site/
        run: |
          set -euo pipefail
          cp -r docs site
          rc=0
          python generate_all_location_figures.py --primary hybrid --output-dir site --old-dir site/old || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          python - <<'EOF' | tee preview_summary.md
          import json
          b = json.load(open('site/forecast_data.json'))
          print('### Preview forecast build')
          print()
          print('| location | model | forecast start | likely-range band | band width 24 h / 240 h (m) | flag probabilities from |')
          print('|---|---|---|---|---|---|')
          for k, loc in b['locations'].items():
              tot = loc['ensemble'].get('total')
              w = (f"{tot['p90'][24] - tot['p10'][24]:.3f} / {tot['p90'][-1] - tot['p10'][-1]:.3f}"
                   if tot else '-')
              print(f"| {k} | {loc.get('model', 'september')} | {loc['forecast_start']} | "
                    f"{'yes' if tot else 'NO'} | {w} | {loc['flag_probability'].get('source')} |")
          notes = [f"- {k}: {loc['model_note']}" for k, loc in b['locations'].items() if loc.get('model_note')]
          if notes:
              print()
              print('Notes:')
              print('\n'.join(notes))
          idx = json.load(open('site/archive/index.json'))
          print()
          print(f"Archive: {len(idx['issues'])} forecasts, latest slot {idx['issues'][-1]['slot']}.")
          EOF
          {
            echo
            echo "Rain caches: long CSVs $(ls data/rainfall_training_data/*.csv 2>/dev/null | wc -l) files, newest reading $(python src/flag_predictor/data/rain_cache_newest.py data/rainfall_training_data); recent CSVs newest reading $(python src/flag_predictor/data/rain_cache_newest.py data/recent_rainfall)."
          } >> preview_summary.md
          cat preview_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the summary on the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file preview_summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
          retention-days: 7
