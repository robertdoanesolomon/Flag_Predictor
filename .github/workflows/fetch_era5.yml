name: Fetch ERA5 evapotranspiration (one-off)

# Runs only on pushes to the data/era5-et branch. Downloads hourly catchment-mean
# ET0, temperature and soil moisture (2000 -> ~now) from the Open-Meteo archive
# and commits the file to that branch.
on:
  push:
    branches: [data/era5-et]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy<2" pandas requests
      - name: Download
        run: python src/flag_predictor/data/download_et.py --start 2000-01-01 --out data/era5/et0_hourly.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: era5-et0
          path: data/era5/et0_hourly.csv.gz
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/era5/et0_hourly.csv.gz
          git commit -m "ERA5 ET0 2000-now [skip ci]" || exit 0
          git push origin HEAD:data/era5-et
