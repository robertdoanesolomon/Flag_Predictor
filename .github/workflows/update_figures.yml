name: Update forecast figures

on:
  # Run roughly every fifteen minutes UTC (GitHub may delay queued runs under load).
  schedule:
    - cron: "*/15 * * * *"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Prevent overlapping runs (scheduled/manual) from racing on git push
concurrency:
  group: update-forecast-figures
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push commits back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Required so the workflow can push back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Large EA rainfall dumps live in data/rainfall_training_data/ (gitignored to keep repo small).
      # The forecasting script still merges these files with API data; runners start with an empty tree.
      - name: Weekly cache slug for rainfall CSVs
        id: rainfall-week
        run: echo "w=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore cached EA rainfall CSVs
        uses: actions/cache@v4
        id: rainfall-cache
        with:
          path: data/rainfall_training_data
          key: ea-rain-${{ runner.os }}-v1-${{ steps.rainfall-week.outputs.w }}
          restore-keys: |
            ea-rain-${{ runner.os }}-v1-

      - name: Populate rainfall_training_data when cache miss
        run: |
          set -euo pipefail
          mkdir -p data/rainfall_training_data
          COUNT="$(find data/rainfall_training_data -maxdepth 1 -type f -name '*.csv' | wc -l | tr -d ' ')"
          MIN_DATE="$(python -c "from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(days=800)).strftime('%Y-%m-%d'))")"
          if [ "${COUNT:-0}" -lt 15 ]; then
            echo "Downloading EA qualified rainfall CSVs since ${MIN_DATE} (had ${COUNT} files) ..."
            python src/flag_predictor/data/download_rainfall.py --min-date "$MIN_DATE" --delay 1.5
          else
            echo "Rainfall_training_data cache usable (${COUNT} CSV files)."
          fi

      - name: Generate figures into docs/
        run: |
          set -euo pipefail

          regenerate_and_commit_once() {
            python generate_all_location_figures.py --output-dir docs
            if git diff --quiet HEAD -- docs; then
              echo "No changes under docs/"
              return 1
            fi
            git add docs/
            git commit -m "Update forecast figures [skip ci]"
            return 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Always branch from remote main before generating — avoids stacking a second
          # figure commit onto one that landed while this job ran (PNG/JSON rebase conflicts).
          git fetch origin main
          git checkout -B main origin/main

          regenerate_and_commit_once || { echo "No commit needed"; exit 0; }

          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push failed (attempt $i): updating from origin/main, regenerating, retrying..."
            sleep $((i * 5))
            git fetch origin main
            git reset --hard origin/main
            regenerate_and_commit_once || { echo "No changes after retry; exiting."; exit 0; }
          done

          echo "Failed to push after retries"
          exit 1

