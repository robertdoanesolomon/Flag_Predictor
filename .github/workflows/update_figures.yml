name: Update forecast figures

on:
  # Main trigger: an external timer (cron-job.org) calls the workflow_dispatch API
  # every 15 minutes, because GitHub only fires frequent schedules every few hours.
  # This schedule is a backup; off-peak minutes are less congested than :00/:15.
  schedule:
    - cron: "7,22,37,52 * * * *"

  # Manual runs from the Actions tab, and the external timer
  workflow_dispatch:

# One run at a time. Runs take 8-20 min, so don't cancel a run in progress when the
# next trigger arrives: queue it instead (GitHub keeps at most one pending run).
concurrency:
  group: update-forecast-figures-v2   # renamed 19 Oct 2026: a stuck run held the old group
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # A normal run takes ~6-12 min. A hung upstream API (EA, Open-Meteo) must not hold the
    # queue for hours: give up and let the next 15-minute run try.
    timeout-minutes: 25
    permissions:
      contents: write  # Required to push commits back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Required so the workflow can push back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Large EA rainfall dumps live in data/rainfall_training_data/ (gitignored to keep repo small).
      # The forecasting script still merges these files with API data; runners start with an empty tree.
      - name: Weekly cache slug for rainfall CSVs
        id: rainfall-week
        run: echo "w=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore cached EA rainfall CSVs
        uses: actions/cache@v4
        id: rainfall-cache
        with:
          path: data/rainfall_training_data
          # v2: start from a fresh 800-day download (the v1 cache stopped at May 2026,
          # because the downloader never overwrites existing files).
          key: ea-rain-${{ runner.os }}-v2-${{ steps.rainfall-week.outputs.w }}
          restore-keys: |
            ea-rain-${{ runner.os }}-v2-

      - name: Populate rainfall_training_data when cache miss
        run: |
          set -euo pipefail
          mkdir -p data/rainfall_training_data
          COUNT="$(find data/rainfall_training_data -maxdepth 1 -type f -name '*.csv' | wc -l | tr -d ' ')"
          MIN_DATE="$(python -c "from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(days=800)).strftime('%Y-%m-%d'))")"
          # The Isis model simulates the catchment through the last ~2 years of rain, so a
          # cache whose newest reading is older than the 50-day recent-rain folder would
          # leave a hole (it then falls back to the plain hybrid). Refresh it when stale.
          NEWEST="$(python src/flag_predictor/data/rain_cache_newest.py data/rainfall_training_data)"
          STALE="$(python -c "from datetime import date, timedelta; print(int(date.fromisoformat('${NEWEST}') < date.today() - timedelta(days=40)))")"
          if [ "${COUNT:-0}" -lt 15 ]; then
            echo "Downloading EA qualified rainfall CSVs since ${MIN_DATE} (had ${COUNT} files) ..."
            python src/flag_predictor/data/download_rainfall.py --min-date "$MIN_DATE" --delay 1.5
          elif [ "$STALE" = "1" ] && [ "${{ steps.rainfall-cache.outputs.cache-hit }}" != "true" ]; then
            # Only on the first run of a week (new cache key), so the refreshed files are saved.
            # download_rainfall.py never overwrites, so download into a fresh folder and swap.
            echo "Refreshing stale rainfall CSVs (newest reading ${NEWEST}) since ${MIN_DATE} ..."
            rm -rf data/rainfall_refresh
            if python src/flag_predictor/data/download_rainfall.py --min-date "$MIN_DATE" \
                 --output-dir data/rainfall_refresh --delay 1.5 \
               && [ "$(find data/rainfall_refresh -maxdepth 1 -name '*.csv' -size +1k | wc -l)" -ge 15 ]; then
              mv -f data/rainfall_refresh/*.csv data/rainfall_training_data/
              echo "Refreshed: newest reading now $(python src/flag_predictor/data/rain_cache_newest.py data/rainfall_training_data)"
            else
              echo "Refresh failed; keeping the cached files (the Isis model falls back if needed)."
            fi
            rm -rf data/rainfall_refresh
          else
            echo "Rainfall_training_data cache usable (${COUNT} CSV files, newest reading ${NEWEST})."
          fi

      # The physics hybrid (main page) needs ~5 weeks of continuous gauge rain. The weekly
      # cache above can hold stale CSVs, so keep a separate recent-rain folder that is
      # refreshed at most once per day. Failures here never block publishing; the main page falls back to the LSTM.
      - name: Daily cache slug for recent rainfall (physics model)
        id: recent-rain-day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore recent rainfall (physics model)
        uses: actions/cache@v4
        with:
          path: data/recent_rainfall
          key: ea-recent-rain-${{ runner.os }}-v1-${{ steps.recent-rain-day.outputs.d }}

      - name: Download recent rainfall once per day (physics model)
        continue-on-error: true
        run: |
          if ! ls data/recent_rainfall/*.csv >/dev/null 2>&1; then
            python src/flag_predictor/data/download_rainfall.py \
              --min-date "$(date -u -d '50 days ago' +%F)" \
              --output-dir data/recent_rainfall --delay 1.0 || true
          fi

      - name: Generate figures into docs/
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Always branch from remote main before generating — avoids stacking a second
          # figure commit onto one that landed while this job ran (PNG/JSON rebase conflicts).
          git fetch origin main
          git checkout -B main origin/main

          # Exit codes from generate_all_location_figures.py:
          #   0 = all locations generated; 2 = partial (some locations failed but
          #   others updated — publish what we have, then mark the run failed so
          #   the problem stays visible). Anything else = hard failure.
          GEN_RC=0
          generate_once() {
            local rc=0
            python generate_all_location_figures.py --primary hybrid --output-dir docs --old-dir docs/old --preview-dir docs/preview || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
              echo "Figure generation failed hard (exit $rc)."
              exit "$rc"
            fi
            GEN_RC=$rc
          }

          finish() {
            if [ "$GEN_RC" -ne 0 ]; then
              echo "Some locations failed to generate (see errors above); published partial update."
              exit 1
            fi
            exit 0
          }

          # docs/ holds the site (incl. docs/archive, the forecast history);
          # data/forecast_archive holds the raw member rain of each archived forecast.
          commit_docs_if_changed() {
            git add docs/
            if [ -d data/forecast_archive ]; then git add data/forecast_archive/; fi
            if git diff --cached --quiet; then
              echo "No changes under docs/ or data/forecast_archive/"
              return 1
            fi
            git commit -m "Update forecast figures [skip ci]"
            return 0
          }

          generate_once
          if ! commit_docs_if_changed; then
            echo "Generation ran but docs/ already up to date."
            finish
          fi

          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              finish
            fi
            sleep $((i * 5))
            git fetch origin main
            # Usually main moved for a code or page change that does not touch the generated
            # files: put this forecast on top of it and push, without regenerating (~6 min).
            if git rebase origin/main; then
              echo "Push failed (attempt $i): rebased the forecast onto the new main, retrying..."
              continue
            fi
            git rebase --abort || true
            echo "Push failed (attempt $i): the generated files conflict; regenerating on the new main..."
            git reset --hard origin/main
            generate_once
            if ! commit_docs_if_changed; then
              echo "No changes after retry; exiting."
              finish
            fi
          done

          echo "Failed to push after retries"
          exit 1

      # Flag alerts (push/send_push.py): after the forecast, whether or not every location
      # succeeded. Does nothing until the Cloudflare secrets are set; never fails the run.
      - name: Send flag alerts
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python push/send_push.py
