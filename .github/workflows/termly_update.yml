name: Termly outlook

# flagpredictor.com/termly: generate_termly.py once a day (Farmoor's daily flow for the day before,
# then the outlook), and verify_termly.py (the leave-one-year-out test, ~1 min) on Sundays and
# whenever the termly code changes. Commits only docs/termly/ and data/termly/, which nothing else writes.
on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/flag_predictor/termly.py'
      - 'generate_termly.py'
      - 'verify_termly.py'

concurrency:
  group: termly-outlook
  cancel-in-progress: false

jobs:
  termly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Verify (Sundays, code changes, or no result yet)
        if: ${{ github.event_name != 'schedule' || hashFiles('docs/termly/verification.json') == '' }}
        run: python verify_termly.py

      - name: Verify on Sundays
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%u)" = "7" ]; then python verify_termly.py; fi

      - name: Outlook
        run: python generate_termly.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OUT=$(mktemp -d)
          # data files only: never the page, which may have changed on main since this run started
          tar -cf "$OUT/termly.tar" docs/termly/termly.json docs/termly/verification.json data/termly
          for i in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            tar -xf "$OUT/termly.tar"
            git add docs/termly/termly.json docs/termly/verification.json data/termly
            if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
            git commit -m "Termly outlook [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 10))
          done
          exit 1
