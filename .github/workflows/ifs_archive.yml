name: IFS forecast-rain archive (rise backtest)

# fetch_ifs_archive.py: what ECMWF IFS forecast for each rain station, 0-7 days ahead, month by month, for
# backtesting rises with the rain that was forecast. Run from the Actions tab on any branch; commits the
# monthly files back to the branch it ran on. Months already on disk are skipped, so reruns fill gaps.
on:
  workflow_dispatch:
    inputs:
      start: {description: 'first month (YYYY-MM-DD)', default: '2024-10-01'}
      end: {description: 'last day (YYYY-MM-DD)', default: '2026-01-31'}
  push:                    # or change this file on a branch (runs with the defaults)
    paths: ['data/verification/ifs_runs/request.txt']

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Fetch
        continue-on-error: true
        timeout-minutes: 100
        run: python fetch_ifs_archive.py --start "${{ inputs.start || '2023-01-01' }}" --end "${{ inputs.end || '2026-01-31' }}"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BR="${GITHUB_REF_NAME}"
          OUT=$(mktemp -d)
          tar -cf "$OUT/v.tar" data/verification/ifs_runs
          for i in 1 2 3 4 5; do
            git fetch --depth=1 origin "$BR"
            git reset --hard "origin/$BR"
            tar -xf "$OUT/v.tar"
            git add data/verification/ifs_runs
            if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
            git commit -m "IFS forecast-rain archive [skip ci]"
            if git push origin "HEAD:$BR"; then exit 0; fi
            sleep $((i * 10))
          done
          exit 1
