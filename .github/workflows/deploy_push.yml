name: Deploy flag alerts

# Sets up the Cloudflare side of the flag alerts: the storage for sign-ups (KV), the signing
# keys (VAPID, kept in KV), the Worker that takes sign-ups, and docs/preview/push_config.json
# so the page knows where to send them. Safe to run again at any time.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

# Run it from the Actions tab (once after adding the secrets, and again after changing push/worker/).
on:
  workflow_dispatch:

concurrency:
  group: deploy-flag-alerts
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install requests cryptography

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Storage and signing keys
        run: |
          NS=$(python push/setup_push.py namespace | tail -1)
          echo "KV namespace: $NS"
          sed -i "s/__KV_NAMESPACE_ID__/$NS/" push/worker/wrangler.toml
          python push/setup_push.py keys

      - name: Deploy the Worker
        working-directory: push/worker
        run: npx --yes wrangler@4 deploy

      - name: Write the page's alerts config
        run: |
          python push/setup_push.py config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/preview/push_config.json
          if git diff --cached --quiet; then echo "config unchanged"; exit 0; fi
          git commit -m "Flag alerts config [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
